<script>
// Disposable, in-memory UI prototype. Three structural alternatives share the same sample records.
const icons={calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h2m4 0h2"/>',people:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.9M15 3.1a4 4 0 0 1 0 7.8"/><circle cx="9" cy="7" r="4"/>',time:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<path d="m5 12 4 4L19 6"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/>',plus:'<path d="M12 5v14M5 12h14"/>',left:'<path d="m14 6-6 6 6 6"/>',right:'<path d="m10 6 6 6-6 6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',music:'<path d="M9 18V5l12-2v13M9 9l12-2"/><ellipse cx="6" cy="18" rx="3" ry="3"/><ellipse cx="18" cy="16" rx="3" ry="3"/>',location:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',spark:'<path d="m12 3 2.3 6.7L21 12l-6.7 2.3L12 21l-2.3-6.7L3 12l6.7-2.3Z"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-9h.01"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.calendar}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today='2026-11-06',base=new Date('2026-11-02T12:00:00Z');
const dateAdd=(date,n)=>{let d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const fmt=(date,opts={day:'numeric',month:'short'})=>new Intl.DateTimeFormat('en-GB',{...opts,timeZone:'UTC'}).format(new Date(date+'T12:00:00Z'));
const formatTime=n=>`${Math.floor(n).toString().padStart(2,'0')}:${Math.round((n%1)*60).toString().padStart(2,'0')}`;
const avatar=(name,cls='')=>`<span class="avatar ${cls}" aria-hidden="true">${name.split(' ').map(s=>s[0]).join('').slice(0,2)}</span>`;
const params=new URLSearchParams(location.search);
const variants=['week','agenda','planner'];
const state={variant:variants.includes(params.get('variant'))?params.get('variant'):'week',view:['calendar','plan','people','group'].includes(location.hash.slice(1))?location.hash.slice(1):'calendar',week:0,day:today,filter:'all',form:false,friendForm:false,query:'',previewPerson:'Maya Chen',shares:{'Maya Chen':'availability','Jamie Patel':'none','Sam Ellis':'none'},selfAvail:['available','unknown','available','available','busy','unknown'],answers:['yes','yes','maybe'],confirmed:null,planTitle:'Dinner with friends',planGroup:'friends',addedOptions:[],acceptedErin:false};
const events=[
{id:'reset',date:'2026-11-02',start:9,end:10,title:'Weekly reset',category:'personal',place:'Home',audience:'Only you',status:'Private'},

{id:'dentist',date:'2026-11-04',start:12.5,end:13.25,title:'Dentist',category:'personal',place:'High Street Dental',audience:'Only you',status:'Private'},
{id:'rehearsal1',date:'2026-11-05',start:19,end:21,title:'Rehearsal',category:'band',place:'Studio 3 · Soundhouse',audience:'The Sunday Set · 4 members',status:'Going'},
{id:'project',date:'2026-11-06',start:10,end:11.5,title:'Project time',category:'personal',place:'Home',audience:'Only you',status:'Private'},
{id:'dinner',date:'2026-11-06',start:18.5,end:20,title:'Dinner at Rosa’s',category:'friends',place:'Rosa’s · 14 Market Street',audience:'You, Maya and Jamie',status:'Going'},
{id:'walk',date:'2026-11-07',start:10,end:12,title:'Long walk',category:'personal',place:'Riverside',audience:'Only you',status:'Private'},
{id:'rehearsal2',date:'2026-11-08',start:16,end:18,title:'Sunday rehearsal',category:'band',place:'Studio 3 · Soundhouse',audience:'The Sunday Set · 4 members',status:'Reply needed'},
{id:'gig',date:'2026-11-20',start:20,end:22,title:'Live at The Lantern',category:'band',place:'The Lantern · Main stage',audience:'The Sunday Set · 4 members',status:'Going'}
];
const friends=[{name:'Maya Chen',cls:'maya',incoming:'Shares availability with you'},{name:'Jamie Patel',cls:'jamie',incoming:'Shares availability with you'},{name:'Sam Ellis',cls:'sam',incoming:'No calendar shared with you'}];
const options=[{date:'2026-11-12',time:'18:30'},{date:'2026-11-13',time:'19:00'},{date:'2026-11-14',time:'18:30'}];
const otherAnswers=[['yes','yes','maybe'],['no','yes','unknown'],['unknown','maybe','yes']];
const categoryLabel=c=>({personal:'Personal',friends:'Friends',band:'The Sunday Set'}[c]||c);
const categoryIcon=c=>c==='band'?'music':c==='friends'?'people':'calendar';
const chip=(text,cls='neutral')=>`<span class="chip ${cls}">${esc(text)}</span>`;
const button=(text,action,cls='',extra='')=>`<button class="button ${cls}" data-action="${action}" ${extra}>${text}</button>`;
const weekDates=()=>Array.from({length:7},(_,i)=>dateAdd('2026-11-02',state.week*7+i));
const filtered=(items)=>items.filter(e=>state.filter==='all'||e.category===state.filter);
const sorted=items=>[...items].sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start);
const personalDetailsShared=()=>Object.values(state.shares).includes('details');
const personalAudience=()=>{const detail=Object.entries(state.shares).filter(([,v])=>v==='details').map(([n])=>n.split(' ')[0]);return detail.length?'Details shared with '+detail.join(', '):'Event details: only you'};
const statusChip=e=>chip(e.cancelled?'Cancelled':e.category==='personal'&&personalDetailsShared()?'Details shared':e.status,e.cancelled?'red':e.status==='Reply needed'?'amber':e.status==='Private'?'neutral':'green');
function notify(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),3000)}

function navigate(view){state.view=view;state.form=false;setUrl();render();window.scrollTo({top:0,behavior:'instant'})}
function logo(){return `<a class="brand" href="#calendar" data-action="nav" data-view="calendar">${icon('calendar')}<span>MiniCalendar</span></a>`}
function sidebar(){return `<aside class="sidebar">${logo()}<nav class="navigation" aria-label="Main navigation">${[['calendar','calendar','Calendar'],['plan','time','Find a time'],['people','people','People'],['group','music','My group']].map(([v,i,n])=>`<button class="nav-item ${state.view===v?'active':''}" data-action="nav" data-view="${v}" ${state.view===v?'aria-current="page"':''} aria-label="${n}">${icon(i)}<span>${n}</span>${v==='plan'&&!state.confirmed?'<span class="count">1</span>':''}</button>`).join('')}</nav><div class="mini-month"><h3>November 2026</h3><div class="mini-days">${['M','T','W','T','F','S','S'].map(d=>`<span>${d}</span>`).join('')}${Array(6).fill('<span></span>').join('')}${Array.from({length:30},(_,i)=>`<span class="day ${i===5?'today':''}">${i+1}</span>`).join('')}</div><div class="side-group"><p class="side-label">Your calendars</p>${['personal','friends','band'].map(c=>`<button class="nav-item" data-action="filter" data-filter="${c}"><i class="dot ${c}"></i><span>${categoryLabel(c)}</span></button>`).join('')}</div></div><div class="account">${avatar('Alex Morgan')}<span><strong>Alex Morgan</strong><span class="muted">Personal account</span></span></div></aside>`}
function header(title,subtitle,actions=''){return `<header class="page-head"><div><h1>${title}</h1><p>${subtitle}</p></div>${actions?`<div class="page-actions">${actions}</div>`:''}</header>`}
function calendarActions(){return `<div class="date-nav">${button(icon('left'),'prev','icon-button','aria-label="Previous week"')}${button('Today','today','')}${button(icon('right'),'next','icon-button','aria-label="Next week"')}</div>${button(icon('plus')+'New event','new-event','primary')}`}
function filters(){return `<div class="view-tools"><div class="filters" aria-label="Filter calendars">${['all','personal','friends','band'].map(c=>`<button class="filter ${state.filter===c?'active':''}" data-action="filter" data-filter="${c}" aria-pressed="${state.filter===c}">${c!=='all'?`<i class="dot ${c}"></i>`:''}${c==='all'?'Everything':categoryLabel(c)}</button>`).join('')}</div><span class="muted small">Europe/London</span></div>`}
function weekStrip(){return `<div class="week-strip" aria-label="Choose a day">${weekDates().map(d=>`<button data-action="day" data-date="${d}" class="${state.day===d?'active':''}" aria-pressed="${state.day===d}"><span>${fmt(d,{weekday:'short'})}</span><strong>${fmt(d,{day:'numeric'})}</strong><i class="dot" style="width:4px;height:4px;background:${events.some(e=>e.date===d)?'currentColor':'transparent'}"></i></button>`).join('')}</div>`}
function agendaRow(e,group=false){return `<div class="agenda-row ${e.cancelled?'event-cancelled':''}"><span class="event-time">${group?`<strong>${fmt(e.date)}</strong>`:''}${formatTime(e.start)}<br><span class="small">${formatTime(e.end)}</span></span><div class="details"><span class="category-icon ${e.category}">${icon(categoryIcon(e.category))}</span><div><button class="event-link" data-action="event" data-id="${e.id}">${esc(e.title)}</button><p>${esc(e.place||categoryLabel(e.category))}</p></div></div>${group?button(e.status==='Reply needed'?'Respond':'Details','event','compact',`data-id="${e.id}"`):statusChip(e)}</div>`}
function dayAgenda(day){const list=filtered(sorted(events.filter(e=>e.date===day)));return `<div class="agenda-date"><strong>${fmt(day,{day:'numeric'})}</strong><div><h3>${day===today?'Today':fmt(day,{weekday:'long'})}</h3>${fmt(day,{month:'long'})}</div></div>${list.length?list.map(e=>agendaRow(e)).join(''):`<div class="empty"><h2>Nothing on this calendar</h2><p>Add a plan or choose another day. An empty calendar doesn’t declare you available.</p>${button('Add an event','new-event','compact')}</div>`}`}
function eventForm(){return state.form?`<section class="form-box" aria-labelledby="event-form-heading"><h2 id="event-form-heading">New event</h2><form id="event-form"><div class="form-grid"><label class="field">Event name<input name="title" required placeholder="What are you planning?" maxlength="80"></label><label class="field">Date<input name="date" type="date" required value="${state.day}"></label><label class="field">Calendar<select name="category"><option value="personal">Personal calendar</option><option value="friends">Friends · selected people</option><option value="band">The Sunday Set · group</option></select></label><label class="field">Location<input name="place" placeholder="Add a place" maxlength="100"></label><label class="field">Starts<input name="start" type="time" value="18:00" required></label><label class="field">Ends<input name="end" type="time" value="19:00" required></label></div><p class="small muted" style="margin-top:12px">In this preview, Friends means Maya and Jamie. Personal events use your current sharing settings.</p><p class="form-error" id="event-error" role="alert"></p><div class="actions"><button class="button primary" type="submit">Add event</button>${button('Cancel','cancel-form')}</div></form></section>`:''}

function todayPanel(){return `<aside class="today-panel"><section><h2>Friday, 6 November</h2><p class="small muted">A little room to breathe.</p>${events.filter(e=>e.date===today).map(e=>`<div class="timeline-item"><span class="time">${formatTime(e.start)}</span><div><button class="event-link" data-action="event" data-id="${e.id}">${esc(e.title)}</button><p>${esc(e.place)}</p>${e.category==='friends'?'<div class="avatars" style="margin-top:9px">'+avatar('Alex Morgan')+avatar('Maya Chen','maya')+avatar('Jamie Patel','jamie')+'</div>':''}</div></div>`).join('')}</section><section><div class="inline spread"><h2>Plans in the making</h2>${chip(state.confirmed?'1 planned':'1 open',state.confirmed?'green':'blue')}</div><div class="request"><h3>${esc(state.planTitle)}</h3><p>${state.confirmed?'A time is chosen. Attendance replies are next.':'Three possible evenings. Find the one that works together.'}</p>${button(state.confirmed?'See the plan':'Compare times','open-plan','compact')}</div></section><section><h2>Your sharing</h2><p class="quiet-note">${icon('lock')}<span>You choose what friends can see. Connecting never opens your calendar.</span></p>${button('Manage sharing '+icon('right'),'open-people','quiet compact')}</section></aside>`}
function calendarView(){const dates=weekDates();const subtitle=`${fmt(dates[0])} – ${fmt(dates[6],{day:'numeric',month:'long',year:'numeric'})}`;return header(state.variant==='agenda'?'Make room for your week':state.variant==='planner'?'Good plans start here':'Your week',subtitle,calendarActions())+eventForm()+filters()+(state.variant==='week'?`<div class="week-layout"><div>${weekGrid()}<div class="mobile-agenda">${weekStrip()}${dayAgenda(state.day)}</div></div>${todayPanel()}</div>`:state.variant==='agenda'?agendaView():plannerView())}
function agendaView(){return `<div class="agenda-layout"><section>${weekStrip()}${[state.day,dateAdd(state.day,1),dateAdd(state.day,2)].map(d=>dayAgenda(d)).join('')}</section><aside class="agenda-aside"><section class="week-note"><div class="avatars">${avatar('Maya Chen','maya')+avatar('Jamie Patel','jamie')+avatar('Sam Ellis','sam')}</div><h2>A plan worth getting together for.</h2><p>Find an evening for dinner without sharing your whole calendar.</p>${button('Find a time '+icon('right'),'open-plan','primary')}</section><section><h2>Coming up with your band</h2>${events.filter(e=>e.category==='band'&&e.date>=today).slice(0,2).map(e=>`<div class="timeline-item"><span class="time">${fmt(e.date)}</span><div><button class="event-link" data-action="event" data-id="${e.id}">${esc(e.title)}</button><p>${formatTime(e.start)} · ${esc(e.place)}</p></div></div>`).join('')}<p class="quiet-note">${icon('info')}<span>Shared events stay together. Your personal calendar stays yours.</span></p></section></aside></div>`}
function availability(){const days=['Tue 10','Wed 11','Thu 12','Fri 13','Sat 14','Sun 15'];const rows=[state.selfAvail,['busy','available','available','available','unknown','busy'],['unknown','busy','busy','available','available','unknown'],['unknown','unknown','unknown','unknown','unknown','unknown']];return `<div class="availability-wrap" tabindex="0" role="region" aria-label="Shared evening availability; scroll horizontally on small screens"><table class="availability-table"><thead><tr><th>Evenings<br>18:00–21:00</th>${days.map(d=>`<th>${d.split(' ')[0]}<strong>${d.split(' ')[1]} Nov</strong></th>`).join('')}</tr></thead><tbody>${['You','Maya','Jamie','Sam'].map((name,r)=>`<tr><td><div class="person">${avatar(name,r===1?'maya':r===2?'jamie':r===3?'sam':'')}<span>${name}</span></div></td>${rows[r].map((s,c)=>`<td class="${s}">${r===0?`<button data-action="availability" data-slot="${c}" aria-label="Your availability ${days[c]}: ${s==='unknown'?'Not shared':s}. Change status.">${s==='available'?'Available':s==='busy'?'Busy':'Not shared'}</button>`:s==='available'?'Available':s==='busy'?'Busy':'Not shared'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="legend"><span><i class="available"></i>Declared available</span><span><i class="busy"></i>Busy</span><span><i class="unknown"></i>Not shared / unknown</span></div><p class="small muted" style="margin-top:14px">Your row is shared with this planning group in the sample. Tap your times to change them. Sam hasn’t shared a calendar; you can still invite him to a plan.</p>`}
function plannerView(){return `<div class="planning-layout"><section><div class="planning-summary"><div class="avatars">${avatar('Alex Morgan')+avatar('Maya Chen','maya')+avatar('Jamie Patel','jamie')+avatar('Sam Ellis','sam')}</div><div><h2>When could we get together?</h2><p>Shared evenings · 10–15 November · London time</p></div></div>${availability()}<div class="plan-teaser">${chip(state.confirmed?'Time chosen':'Waiting for a time',state.confirmed?'green':'amber')}<h3>${esc(state.planTitle)}</h3><p>${state.confirmed?'An evening is chosen. Check attendance next.':'3 candidate evenings · 4 people · replies are still coming in'}</p>${button('Open plan '+icon('right'),'open-plan','primary')}</div><p class="quiet-note">${icon('lock')}<span>Availability is shared separately from event details. A free-looking evening is not a commitment to attend.</span></p></section><aside class="planning-aside"><h2>Your next few days</h2>${sorted(events.filter(e=>e.date>=today)).slice(0,4).map(e=>`<div class="timeline-item"><span class="time">${fmt(e.date)}</span><div><button class="event-link" data-action="event" data-id="${e.id}">${esc(e.title)}</button><p>${formatTime(e.start)} · ${categoryLabel(e.category)}</p></div></div>`).join('')}${button('View upcoming events','agenda-layout','quiet compact')}</aside></div>`}
function response(s){return chip(s==='yes'?'Yes':s==='no'?'No':s==='maybe'?'Maybe':'No reply',s==='yes'?'green':s==='no'?'red':s==='maybe'?'amber':'neutral')}
function participantSidebar(){return `<aside class="plan-aside"><section><h3>Planning together</h3><div class="participant">${avatar('Alex Morgan')}<div>Alex Morgan<div class="small">You · organiser</div></div></div>${friends.map(p=>`<div class="participant">${avatar(p.name,p.cls)}<div>${p.name}<div class="small">${p.name==='Sam Ellis'?'Some times unanswered':'Replied to this plan'}</div></div></div>`).join('')}</section><section><h3>Only this plan is shared</h3><p class="small muted">Invited people can see the proposed times and replies. Your other events stay private.</p><p class="quiet-note">${icon('lock')}<span>Nothing is sent to anyone in this sample.</span></p></section></aside>`}
function planView(){return header('Find a time','Bring the plan together, one reply at a time.',button('Check shared availability','toggle-availability',''))+`<div class="plan-layout"><section><div class="inline spread"><h2 class="plan-title">${esc(state.planTitle)}</h2>${chip(state.confirmed?'Time chosen':'Choosing a time',state.confirmed?'green':'blue')}</div><p class="plan-meta">${state.planGroup==='band'?'The Sunday Set':'You, Maya, Jamie and Sam'} · ${state.planGroup==='band'?'2 hours':'90 minutes'} · Europe/London</p><div id="plan-availability" hidden class="panel" style="margin-bottom:22px"><h3>Shared evening availability</h3>${availability()}</div>${state.confirmed?confirmedPlan():pollContent()}<p class="bottom-note">Replies apply to this proposal. Attendance is confirmed separately once a time is chosen.</p></section>${participantSidebar()}</div>`}
function pollContent(){
const all=[...options,...state.addedOptions];
const totals=all.map((o,i)=>{const replies=[state.answers[i],...otherAnswers.map(r=>r[i])];return {yes:replies.filter(s=>s==='yes').length,maybe:replies.filter(s=>s==='maybe').length}});
const best=totals.reduce((b,t,i)=>t.yes>totals[b].yes||(t.yes===totals[b].yes&&t.maybe>totals[b].maybe)?i:b,0);
const note=`${fmt(all[best].date,{weekday:'long'})} currently has the strongest replies. Check individual answers before choosing; availability is not an attendance agreement.`;
const selector=i=>`<select aria-label="Your response for ${fmt(all[i].date)}" data-answer="${i}"><option value="unknown" ${!state.answers[i]||state.answers[i]==='unknown'?'selected':''}>No reply</option>${['yes','maybe','no'].map(v=>`<option value="${v}" ${state.answers[i]===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select>`;
return `<div class="notice">${icon('info')}<span>${note}</span></div>
<div class="poll-wrap" tabindex="0" role="region" aria-label="Replies to candidate times"><table class="poll"><thead><tr><th>Replies to this plan</th>${all.map((o,i)=>`<th class="${i===best?'recommended':''}"><span>${fmt(o.date,{weekday:'short'})}</span><strong>${fmt(o.date)}</strong><span>${o.time}</span>${i===best?'<span class="recommended-head">Strongest replies</span>':''}</th>`).join('')}</tr></thead><tbody><tr><td><div class="person">${avatar('Alex Morgan')}You</div></td>${all.map((o,i)=>`<td class="${i===best?'recommended':''}">${selector(i)}</td>`).join('')}</tr>${friends.map((p,r)=>`<tr><td><div class="person">${avatar(p.name,p.cls)}${p.name.split(' ')[0]}</div></td>${all.map((o,i)=>`<td class="${i===best?'recommended':''}">${response(otherAnswers[r][i]||'unknown')}</td>`).join('')}</tr>`).join('')}</tbody><tfoot><tr><td class="muted">Choose when ready</td>${all.map((o,i)=>`<td class="${i===best?'recommended':''}"><div>${totals[i].yes} yes · ${totals[i].maybe} maybe</div>${button('Choose this time','confirm-time',i===best?'primary':'',`data-option="${i}"`)}</td>`).join('')}</tr></tfoot></table></div>
<div class="mobile-options">${all.map((o,i)=>`<section class="mobile-option ${i===best?'recommended':''}"><div class="inline spread"><div><h3>${fmt(o.date,{weekday:'long'})}, ${fmt(o.date)}</h3><p>${o.time} · ${totals[i].yes} yes · ${totals[i].maybe} maybe</p></div>${i===best?chip('Strongest replies','blue'):''}</div><div class="mobile-response"><span>You</span>${selector(i)}</div>${friends.map((p,r)=>`<div class="mobile-response"><span>${p.name.split(' ')[0]}</span>${response(otherAnswers[r][i]||'unknown')}</div>`).join('')}${button('Choose this time','confirm-time',i===best?'primary':'',`data-option="${i}"`)}</section>`).join('')}</div>
<details class="new-options"><summary>Add another option</summary><form id="option-form" style="margin-top:14px"><div class="form-grid"><label class="field">Date<input type="date" name="date" value="2026-11-15" required></label><label class="field">Time<input type="time" name="time" value="18:30" required></label><div class="inline"><button class="button" type="submit">Add time</button></div></div></form></details>`
}
function confirmedPlan(){const o=state.confirmed;return `<div class="notice success">${icon('check')}<span>The plan now has a time. Invitees still need to confirm attendance.</span></div><section class="panel" style="margin-top:20px"><h2>${fmt(o.date,{weekday:'long',day:'numeric',month:'long'})}</h2><p class="muted">${o.time} · ${state.planGroup==='band'?'Studio 3 · Soundhouse':'Location to be agreed'}</p><div class="inline" style="margin-top:20px">${chip('You’re going','green')}${chip('3 attendance replies pending','amber')}</div><div class="inline" style="margin-top:23px">${button('View in calendar','view-confirmed','primary')}${button('Reopen time options','reopen-plan','')}</div></section>`}
function peopleView(){return header('People & sharing','Your people. Your choice of what they can see.',button(icon('plus')+'Invite a friend','invite-friend','primary'))+(state.friendForm?`<section class="form-box"><h2>Invite a friend</h2><form id="friend-form"><div class="form-grid"><label class="field">Email address<input name="email" type="email" placeholder="friend@example.com" required></label><div class="inline"><button type="submit" class="button primary">Create sample invitation</button>${button('Cancel','cancel-invite')}</div></div><p class="small muted" style="margin-top:12px">Accepting a connection won’t share your calendar.</p></form></section>`:'')+`<div class="people-layout"><section><div class="search">${icon('search')}<input type="search" aria-label="Find a friend" placeholder="Find a friend" id="friend-search" value="${esc(state.query)}"></div><div id="friend-results">${friendRows()}</div><div class="notice" style="margin-top:23px">${icon('lock')}<span>These settings control what <strong>you share</strong>. Friends decide separately what they share with you.</span></div><h2 class="subheading">Invitations</h2><div class="person-row"><div class="person-name">${avatar('Erin Wells','erin')}<div><h3>Erin Wells</h3><p>${state.acceptedErin?'Connected · no calendar access':'Wants to connect with you'}</p></div></div>${state.acceptedErin?chip('Connected, not shared','green'):button('Accept connection','accept-friend','compact')}</div></section><aside id="sharing-preview" class="privacy-preview">${sharingPreview()}</aside></div>`}
function friendRows(){const rows=friends.filter(p=>p.name.toLowerCase().includes(state.query.toLowerCase()));return rows.length?rows.map(p=>`<div class="person-row"><div class="person-name">${avatar(p.name,p.cls)}<div><h3>${p.name}</h3><p>${p.incoming}</p><button class="button quiet compact" data-action="preview-person" data-name="${p.name}" style="padding-left:0">Preview their access</button></div></div><label class="field">Your personal calendar<select data-sharing="${p.name}" aria-label="What you share with ${p.name}"><option value="none" ${state.shares[p.name]==='none'?'selected':''}>Nothing</option><option value="availability" ${state.shares[p.name]==='availability'?'selected':''}>Availability only</option><option value="details" ${state.shares[p.name]==='details'?'selected':''}>Event details</option></select></label></div>`).join(''):`<div class="empty"><h2>No matching friends</h2><p>Try another name.</p>${button('Clear search','clear-search','compact')}</div>`}
function sharingPreview(){const name=state.previewPerson,level=state.shares[name],first=name.split(' ')[0];return `<div class="inline">${icon('lock')}<h2>What ${first} can see</h2></div><p>A preview of your personal calendar, viewed as ${first}.</p>${level==='none'?`<div class="preview-event"><strong>No calendar shared</strong>${first} can connect with you and reply to specific invitations, but cannot view your personal calendar.</div>`:`<div class="preview-event"><strong>${level==='details'?'Project time':'Busy'}</strong>Fri 6 Nov · 10:00–11:30${level==='details'?'<br>Home':''}</div><div class="preview-event"><strong>${level==='details'?'Long walk':'Busy'}</strong>Sat 7 Nov · 10:00–12:00${level==='details'?'<br>Riverside':''}</div>`}<p class="permission-summary">${level==='none'?'Friendship doesn’t grant calendar access.':level==='availability'?'Event names, locations and other details are hidden. Gaps do not mean you’ve declared availability.':'This person can see the details of events on your personal calendar.'}</p>${level!=='none'?button('Stop sharing','stop-sharing','compact',`data-name="${name}"`):''}`}
function groupView(){return header('Your group','One place for rehearsals, gigs and the people making them happen.',button(icon('plus')+'Plan a rehearsal','band-plan','primary'))+`<div class="group-layout"><section><div class="group-header"><div class="group-mark">${icon('music')}</div><div><h2>The Sunday Set</h2><p>Private group · 4 members · London</p></div></div><div class="inline spread"><h2>Upcoming together</h2>${chip('Members only','purple')}</div>${sorted(events.filter(e=>e.category==='band'&&e.date>=today)).map(e=>agendaRow(e,true)).join('')}<h2 class="subheading">A time everyone can make</h2><p class="muted">Use a few proposed times for the next rehearsal. A gig with a fixed date can go straight into the calendar.</p><div class="inline" style="margin-top:17px">${button('Compare rehearsal times','band-plan','')}${button('Add a fixed-time event','new-band-event','quiet')}</div></section><aside class="group-members"><h2>In the group</h2>${[{name:'Alex Morgan',cls:'',role:'Organiser'},...friends.map(p=>({...p,role:'Member'}))].map(p=>`<div class="group-member">${avatar(p.name,p.cls)}<span>${p.name.split(' ')[0]}</span><span class="muted">${p.role}</span></div>`).join('')}<p class="quiet-note">${icon('lock')}<span>Group members see group events. Your personal calendar isn’t shared by joining.</span></p><div style="margin-top:25px"><h3>Room, gear, transport</h3><p class="small muted" style="margin-top:6px">A future addition: agree who’s taking care of what, alongside the event.</p></div></aside></div>`}
function render(){document.body.classList.toggle('top-shell',state.variant==='agenda');document.querySelector('#app').innerHTML=`<div class="shell">${sidebar()}<main class="main" id="main" tabindex="-1">${state.view==='calendar'?calendarView():state.view==='plan'?planView():state.view==='people'?peopleView():groupView()}</main></div>`;document.querySelector('#switcher').innerHTML=`<nav class="review-switcher" aria-label="Compare interface concepts"><span class="review-label">Compare layouts</span><button class="arrow" data-action="variant-prev" aria-label="Previous layout">${icon('left')}</button>${variants.map((v,i)=>`<button data-action="variant" data-variant="${v}" class="${state.variant===v?'active':''}" aria-pressed="${state.variant===v}">${['Week','Agenda','Planner'][i]}</button>`).join('')}<button class="arrow" data-action="variant-next" aria-label="Next layout">${icon('right')}</button></nav>`}
function showEvent(id){const e=events.find(e=>e.id===id);if(!e)return;const dialog=document.querySelector('#event-dialog');dialog.innerHTML=`<div class="dialog-head ${e.category}"><div class="inline">${chip(categoryLabel(e.category),e.category==='band'?'purple':e.category==='friends'?'amber':'blue')}${button(icon('close'),'close-dialog','quiet icon-button close','aria-label="Close event"')}</div><h2 id="dialog-title">${esc(e.title)}</h2></div><div class="dialog-body"><div class="detail-line">${icon('calendar')}<div><strong>${fmt(e.date,{weekday:'long',day:'numeric',month:'long'})}</strong><p>${formatTime(e.start)}–${formatTime(e.end)} · Europe/London</p></div></div><div class="detail-line">${icon('location')}<div><strong>${esc(e.place||'Location to be agreed')}</strong></div></div><div class="detail-line">${icon(e.category==='personal'?'lock':'people')}<div><strong>${esc(e.category==='personal'?personalAudience():e.audience)}</strong><p>${e.category==='personal'?'Your sharing settings control access.':'This event is shared. Other calendar events stay private.'}</p></div></div>${e.category!=='personal'&&!e.cancelled?`<div class="attendance"><h3>Your attendance</h3><div class="inline">${['Going','Maybe','Declined'].map(s=>button(s,'rsvp',e.status===s?'selected':'',`data-id="${id}" data-status="${s}"`)).join('')}</div><p class="small muted" style="margin-top:10px">${e.status==='Reply needed'?'You haven’t replied yet.':`Your response: ${e.status}.`}</p></div>`:''}<div class="inline spread" style="margin-top:24px">${statusChip(e)}${!e.cancelled?button('Cancel event','cancel-event','quiet danger compact',`data-id="${id}"`):''}</div></div>`;if(!dialog.open)dialog.showModal()}
function chooseVariant(v){state.variant=v;state.view='calendar';state.form=false;setUrl();render()}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(b.tagName==='A')ev.preventDefault();
if(a==='nav')navigate(b.dataset.view);
else if(a==='open-plan')navigate('plan');else if(a==='open-people')navigate('people');
else if(a==='variant')chooseVariant(b.dataset.variant);else if(a==='variant-next'||a==='variant-prev')chooseVariant(variants[(variants.indexOf(state.variant)+(a==='variant-next'?1:2))%3]);
else if(a==='agenda-layout')chooseVariant('agenda');
else if(a==='filter'){state.filter=state.filter===b.dataset.filter&&b.dataset.filter!=='all'?'all':b.dataset.filter;if(state.view!=='calendar')navigate('calendar');else render()}
else if(a==='prev'||a==='next'||a==='today'){state.week=a==='today'?0:state.week+(a==='next'?1:-1);state.day=a==='today'?today:weekDates()[0];render()}
else if(a==='day'){state.day=b.dataset.date;render()}
else if(a==='new-event'||a==='new-band-event'){if(a==='new-band-event')state.view='calendar';state.form=true;setUrl();render();if(a==='new-band-event')document.querySelector('[name="category"]').value='band';document.querySelector('[name="title"]').focus()}
else if(a==='cancel-form'){state.form=false;render()}
else if(a==='event')showEvent(b.dataset.id);else if(a==='close-dialog')document.querySelector('#event-dialog').close();
else if(a==='rsvp'){events.find(e=>e.id===b.dataset.id).status=b.dataset.status;render();showEvent(b.dataset.id);notify('Attendance updated in this preview.')}
else if(a==='cancel-event'){const e=events.find(e=>e.id===b.dataset.id);e.cancelled=true;e.status='Cancelled';render();showEvent(e.id);notify('Event cancelled in this preview. No notifications are sent.')}
else if(a==='availability'){const i=+b.dataset.slot;state.selfAvail[i]=['unknown','available','busy'][(['unknown','available','busy'].indexOf(state.selfAvail[i])+1)%3];const open=state.view==='plan'&&!document.querySelector('#plan-availability').hidden;render();if(open)document.querySelector('#plan-availability').hidden=false;document.querySelector(`[data-action="availability"][data-slot="${i}"]`).focus();notify('Your shared availability changed for this sample.')}
else if(a==='toggle-availability'){const p=document.querySelector('#plan-availability');p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden))}
else if(a==='confirm-time'){const option=[...options,...state.addedOptions][+b.dataset.option];state.confirmed=option;const previous=events.findIndex(e=>e.id==='new-plan');if(previous>=0)events.splice(previous,1);const start=Number(option.time.split(':')[0])+Number(option.time.split(':')[1])/60;events.push({id:'new-plan',date:option.date,start,end:start+(state.planGroup==='band'?2:1.5),title:state.planTitle,category:state.planGroup==='band'?'band':'friends',place:state.planGroup==='band'?'Studio 3 · Soundhouse':'Location to be agreed',audience:state.planGroup==='band'?'The Sunday Set · 4 members':'You, Maya, Jamie and Sam',status:'Going'});render();document.querySelector('[data-action="view-confirmed"]').focus();notify('Time chosen. Attendance replies are still pending.')}
else if(a==='view-confirmed'){state.week=Math.floor((new Date(state.confirmed.date+'T12:00:00Z')-base)/604800000);state.day=state.confirmed.date;state.filter='all';navigate('calendar')}
else if(a==='reopen-plan'){state.confirmed=null;const i=events.findIndex(e=>e.id==='new-plan');if(i>=0)events.splice(i,1);render();Array.from(document.querySelectorAll('[data-answer]')).find(el=>el.getClientRects().length)?.focus();notify('Time options reopened. The sample event was removed.')}
else if(a==='invite-friend'){state.friendForm=true;render();document.querySelector('[name="email"]').focus()}
else if(a==='cancel-invite'){state.friendForm=false;render()}
else if(a==='accept-friend'){state.acceptedErin=true;render();notify('Connected with Erin. No calendar access granted.')}
else if(a==='preview-person'){state.previewPerson=b.dataset.name;document.querySelector('#sharing-preview').innerHTML=sharingPreview()}
else if(a==='stop-sharing'){state.shares[b.dataset.name]='none';render();notify('Sharing removed. You’re still connected.')}
else if(a==='clear-search'){state.query='';render();document.querySelector('#friend-search').focus()}
else if(a==='band-plan'){state.planGroup='band';state.planTitle='Next band rehearsal';state.confirmed=null;navigate('plan')}
});
document.addEventListener('change',ev=>{if(ev.target.dataset.answer!==undefined){state.answers[+ev.target.dataset.answer]=ev.target.value;const i=ev.target.dataset.answer;render();Array.from(document.querySelectorAll(`[data-answer="${i}"]`)).find(el=>el.getClientRects().length)?.focus();notify('Your reply has been updated. This is not an attendance confirmation.')}if(ev.target.dataset.sharing){const name=ev.target.dataset.sharing;state.shares[name]=ev.target.value;state.previewPerson=name;render();document.querySelector(`[data-sharing="${name}"]`).focus();notify('Sharing updated in this preview.')}});
document.addEventListener('input',ev=>{if(ev.target.id==='friend-search'){state.query=ev.target.value;document.querySelector('#friend-results').innerHTML=friendRows()}});
document.addEventListener('submit',ev=>{ev.preventDefault();const data=new FormData(ev.target);
if(ev.target.id==='event-form'){const title=String(data.get('title')).trim();const start=String(data.get('start')).split(':').map(Number),end=String(data.get('end')).split(':').map(Number);const s=start[0]+start[1]/60,e=end[0]+end[1]/60;if(!title||e<=s){document.querySelector('#event-error').textContent=!title?'Give the event a name.':'Choose an end time after the start. This small preview supports same-day timed events.';return}const cat=data.get('category');events.push({id:'custom-'+Date.now(),date:data.get('date'),start:s,end:e,title,category:cat,place:String(data.get('place')).trim(),audience:cat==='personal'?'Only you':cat==='band'?'The Sunday Set · 4 members':'You, Maya and Jamie',status:cat==='personal'?'Private':'Going'});state.day=data.get('date');state.week=Math.floor((new Date(state.day+'T12:00:00Z')-base)/604800000);state.form=false;state.filter='all';render();notify('Event added to this preview.')}
else if(ev.target.id==='option-form'){state.addedOptions.push({date:data.get('date'),time:data.get('time')});state.answers.push('unknown');render();notify('Another time added. Nobody has replied to it yet.')}
else if(ev.target.id==='friend-form'){state.friendForm=false;render();notify(`Sample invitation prepared for ${data.get('email')}. Nothing was sent.`)}
});
document.addEventListener('keydown',ev=>{if(!['ArrowLeft','ArrowRight'].includes(ev.key)||ev.target.closest('input,select,textarea,[contenteditable],table,[role="region"]')||document.querySelector('dialog[open]'))return;ev.preventDefault();chooseVariant(variants[(variants.indexOf(state.variant)+(ev.key==='ArrowRight'?1:2))%3])});
document.querySelector('#event-dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()}});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['calendar','plan','people','group'].includes(v)&&v!==state.view){state.view=v;state.form=false;render()}});
render();
</script>
</body>
</html>
